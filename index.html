<!doctype html>
<html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>دعوة زفاف</title>
<style>
:root{--gold:#d5b27a;--cream:#f8e8c7}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#090706;color:#fff;font-family:Georgia,"Times New Roman",Tahoma,serif}.page{width:min(100%,560px);margin:auto;background:#110c09;overflow:hidden}
.hero{height:100svh;min-height:650px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 30%,#6a4a2c,#2a1a12 32%,#0d0907 78%)}.envelope{width:min(82vw,390px);aspect-ratio:1/1.28;position:relative;perspective:900px;filter:drop-shadow(0 25px 35px #0009)}.paper{position:absolute;left:7%;right:7%;top:9%;height:83%;background:linear-gradient(145deg,#f6e8df,#ead5cf);z-index:1;transform:translateY(8%);transition:1.1s ease 1s}.flap,.left,.right,.bottom{position:absolute;inset:0;background:#ead9d0}.flap{clip-path:polygon(0 0,100% 0,50% 50%);transform-origin:top center;transition:1.1s cubic-bezier(.2,.8,.2,1);z-index:3}.left{clip-path:polygon(0 0,50% 50%,0 100%);z-index:4}.right{clip-path:polygon(100% 0,100% 100%,50% 50%);z-index:4}.bottom{clip-path:polygon(0 100%,100% 100%,50% 50%);z-index:5}.seal{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:82px;height:82px;border-radius:50%;z-index:10;background:radial-gradient(circle,#a33a4c,#5b1026);border:3px solid #c99363;color:#f9dfba;display:grid;place-items:center;font-size:24px;transition:1s}.opened .flap{transform:rotateX(178deg);z-index:0}.opened .seal{opacity:0;transform:translate(-50%,-50%) scale(1.5)}.opened .paper{transform:translateY(-1%) scale(1.01)}.prompt{position:absolute;bottom:9%;left:0;right:0;text-align:center;z-index:15}.openbtn{border:1px solid var(--gold);background:#1b100b88;color:var(--cream);padding:13px 28px;border-radius:28px;font-size:16px}.opened .prompt{opacity:0;pointer-events:none;transition:.5s}.content{position:absolute;inset:9% 7%;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#573a32;text-align:center}.weddingday{font-size:14px;letter-spacing:3px}.names{font-size:39px;font-style:italic;margin:12px 0}.and{font-size:20px}
section{min-height:100svh;padding:65px 25px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;position:relative;background:radial-gradient(circle at 50% 15%,#513624,#21150f 42%,#0d0907 100%)}section:after{content:"";position:absolute;inset:18px;border:1px solid #d5b27a22;pointer-events:none}h1{font-weight:400;color:var(--cream);font-size:39px;margin:10px}.gold{color:var(--gold)}.desc{line-height:2;opacity:.85}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;margin:25px 0}.box{border:1px solid #b78c5d55;border-radius:12px;padding:17px;background:#ffffff07;line-height:1.8}.full{grid-column:1/-1}.count{color:#efd29b;margin:20px 0;font-size:15px;line-height:2}.btn{border:1px solid var(--gold);color:var(--cream);padding:12px 22px;border-radius:25px;text-decoration:none;background:#0003}.music{position:fixed;bottom:18px;left:18px;z-index:30;width:48px;height:48px;border-radius:50%;border:1px solid var(--gold);background:#1a100ddd;color:var(--cream);font-size:20px;display:none}.music.show{display:block}
</style></head><body><button class="music" id="musicBtn">♫</button><div class="page"><div class="hero" id="hero"><div class="envelope"><div class="paper"><div class="content"><div class="weddingday">WEDDING DAY</div><div id="dateHero"></div><div class="names"><span id="groomHero"></span><div class="and">&amp;</div><span id="brideHero"></span></div></div></div><div class="flap"></div><div class="left"></div><div class="right"></div><div class="bottom"></div><div class="seal">♥</div></div><div class="prompt"><p>اضغط لفتح الدعوة</p><button class="openbtn" onclick="openInvite()">فتح الدعوة</button></div></div>
<section><div class="gold">بسم الله الرحمن الرحيم</div><h1><span id="groom"></span> &amp; <span id="bride"></span></h1><p id="message" class="desc"></p><a class="btn" href="#details">متابعة الدعوة ↓</a></section>
<section id="details"><div class="gold">موعدنا</div><h1>يوم فرحتنا</h1><div class="grid"><div class="box">التاريخ<br><b id="dateText"></b></div><div class="box">الوقت<br><b id="timeText"></b></div><div class="box full">المكان<br><b id="venue"></b><br><small id="address"></small></div></div><div id="count" class="count"></div><a class="btn" id="maps" target="_blank">فتح موقع القاعة</a></section>
<section><div class="gold">ننتظركم بكل محبة</div><h1>تأكيد الحضور</h1><p class="desc">وجودكم هو أجمل ما يكمّل فرحتنا.</p><a class="btn" id="rsvp" target="_blank">تأكيد الحضور عبر واتساب</a></section></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>
const {createClient}=supabase,client=createClient(SUPABASE_URL,SUPABASE_ANON_KEY);let d,music;
async function init(){const slug=new URLSearchParams(location.search).get("invite")||"jaafar-wedding";const q=await client.from("invitations").select("*").eq("slug",slug).eq("published",true).single();if(q.error){document.body.innerHTML='<div style="text-align:center;padding:60px;font-family:Tahoma">هذه الدعوة غير متاحة أو لم يتم نشرها بعد.</div>';return}d=q.data;
["groom","bride","message","dateText","timeText","venue","address"].forEach(k=>document.getElementById(k).textContent=d[k]||"");groomHero.textContent=d.groom;brideHero.textContent=d.bride;dateHero.textContent=(d.dateText||"").replaceAll("/",".");maps.href=d.mapsUrl||"#";rsvp.href="https://wa.me/"+d.rsvpPhone+"?text="+encodeURIComponent("السلام عليكم، أود تأكيد حضوري لحفل زفاف "+d.groom+" و "+d.bride);music=new Audio(d.music||"");music.loop=true;music.volume=Number(d.musicVolume)||.45;musicBtn.onclick=toggle;startCount()}
function play(){if(!music)return;music.play().then(()=>{musicBtn.textContent="Ⅱ";musicBtn.classList.add("show")}).catch(()=>{})}function toggle(){music.paused?play():(music.pause(),musicBtn.textContent="♫")}
function openInvite(){hero.classList.add("opened");musicBtn.classList.add("show");setTimeout(play,1100)}
function startCount(){const el=count,t=new Date(d.countdown).getTime();setInterval(()=>{let x=Math.max(0,t-Date.now()),dd=Math.floor(x/864e5);x%=864e5;let hh=Math.floor(x/36e5);x%=36e5;let mm=Math.floor(x/6e4);x%=6e4;let ss=Math.floor(x/1e3);el.textContent=`${dd} يوم · ${hh} ساعة · ${mm} دقيقة · ${ss} ثانية`},1000)}init();
</script></body></html>
